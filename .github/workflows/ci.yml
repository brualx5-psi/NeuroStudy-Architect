name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify public beta hardening
        run: node scripts/verify-public-beta-hardening.mjs

      - name: Verify guide editing (manual + assisted)
        run: node scripts/verify-guide-manual-and-assisted-edit.mjs

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
