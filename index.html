<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>NeuroStudy Architect</title>
  <script>
    // Polyfill leve: não inventa NODE_ENV
    window.process = window.process || { env: {} };
  </script>
  <!-- Tailwind CDN com configuração inline -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Paleta NeuroStudy — identidade "artigo científico".
    // O app roda no Tailwind Play CDN com este config inline (não há tailwind.config.js),
    // então redefinir as famílias abaixo reescreve todos os usos já existentes nos
    // componentes — indigo/purple/violet/blue/emerald — sem tocar em nenhum deles.
    // As escalas abaixo estao deslocadas um passo para o escuro em relacao ao Tailwind
    // padrao. Motivo: o tom -600 e de longe o mais usado no app (botoes e links), e
    // teal-600 puro da apenas 3.7:1 com texto branco — reprova no WCAG AA. Deslocando,
    // -600 cai em #0f766e e sobe para 5.5:1.
    const teal = {
      50: '#f0fdfa', 100: '#ccfbf1', 200: '#99f6e4', 300: '#5eead4', 400: '#14b8a6',
      500: '#0d9488', 600: '#0f766e', 700: '#115e59', 800: '#134e4a', 900: '#042f2e', 950: '#022c22'
    };
    // Parceiro tonal dos gradientes (era purple/violet): mais um passo abaixo do teal,
    // para que "from-indigo-600 to-purple-700" continue lendo como gradiente.
    const tealDeep = {
      50: '#f0fdfa', 100: '#ccfbf1', 200: '#99f6e4', 300: '#5eead4', 400: '#0d9488',
      500: '#0f766e', 600: '#115e59', 700: '#134e4a', 800: '#042f2e', 900: '#022c22', 950: '#012620'
    };
    // Irmao frio nos gradientes (era blue) e cor categorica em Quiz/MindMap.
    const cyan = {
      50: '#ecfeff', 100: '#cffafe', 200: '#a5f3fc', 300: '#67e8f9', 400: '#06b6d4',
      500: '#0891b2', 600: '#0e7490', 700: '#155e75', 800: '#164e63', 900: '#083344', 950: '#052b38'
    };
    // Sucesso (era emerald): mais amarelado que a primaria e escurecido pelo mesmo
    // motivo de contraste — branco sobre green-600 puro dava 3.3:1.
    const green = {
      50: '#f0fdf4', 100: '#dcfce7', 200: '#bbf7d0', 300: '#86efac', 400: '#22c55e',
      500: '#16a34a', 600: '#15803d', 700: '#166534', 800: '#14532d', 900: '#052e16', 950: '#031c0d'
    };

    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: teal,
            indigo: teal,
            purple: tealDeep,
            violet: tealDeep,
            blue: cyan,
            emerald: green,
            paper: '#fdfbf7',
            ink: { DEFAULT: '#1c1917', soft: '#57534e', faint: '#a8a29e' }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Merriweather', 'serif']
          }
        }
      }
    };
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&display=swap');

    /* CSS Variables para tema - fallback independente do Tailwind */
    :root {
      --bg-primary: #fdfbf7;   /* papel quente */
      --bg-secondary: #ffffff;
      --text-primary: #1c1917; /* tinta, não preto puro */
      --text-secondary: #57534e;
    }

    html.dark {
      --bg-primary: #1c1917;   /* escuro quente — evita o slate/preto genérico */
      --bg-secondary: #292524;
      --text-primary: #fafaf9;
      --text-secondary: #a8a29e;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .paper-shadow {
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    .no-print {
      display: block;
    }

    @media print {
      @page {
        margin: 1cm;
      }

      body {
        background-color: white;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .paper-shadow {
        box-shadow: none;
      }

      .no-print {
        display: none !important;
      }
    }

    .pdf-export .no-print {
      display: none !important;
    }

    .pdf-export {
      background-color: white !important;
      padding: 20px !important;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/client/src/main.tsx"></script>
</body>

</html>
